name: Auto Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🔍 Locating blog-solopreneur directory on VPS..."
            TARGET_DIR=$(find /root /home /var/www -maxdepth 3 -name "blog-solopreneur" 2>/dev/null | head -n 1)
            
            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              echo "✅ Found project at $TARGET_DIR"
            elif [ -d "/root/blog-solopreneur" ]; then
              cd /root/blog-solopreneur
            elif [ -d "$HOME/blog-solopreneur" ]; then
              cd "$HOME/blog-solopreneur"
            else
              echo "❌ Error: Project directory blog-solopreneur not found on VPS"
              exit 1
            fi

            echo "🚀 Pulling latest changes from GitHub..."
            git reset --hard HEAD
            git pull origin main

            export NODE_OPTIONS="--max-old-space-size=4096"

            echo "📦 Installing npm dependencies & Prisma..."
            npm install
            npx prisma db push
            npx prisma generate

            echo "🏗️ Building Next.js application..."
            npm run build

            echo "⚡ Restarting PM2 process..."
            pm2 restart solopreneur-blog || pm2 start npm --name "solopreneur-blog" -- start -- -p 3000

            echo "🎉 Automatic deployment completed successfully!"
